<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Edit Suggestions Proposal</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 id="proposal-heading">Next Edit Suggestions Proposal</h1>
        <p>
          Explore the full API proposal, its goals, lifecycle, and implementation notes brought to
          life with rich markdown formatting.
        </p>
        <div class="header-actions">
          <a class="button" href="./index.html">Back to Playground</a>
        </div>
      </div>
    </header>
    <main class="container proposal-main" aria-labelledby="proposal-heading">
      <article id="proposal-content" class="markdown-body" aria-live="polite">
        <p class="proposal-loading">Loading proposal...</p>
      </article>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>
          Built with <span aria-hidden="true">&#x2665;</span> using the proposed
          <code>vscode.nextEdits</code> API and Monaco playground scaffolding.
        </p>
      </div>
    </footer>
    <script type="module">
      const container = document.getElementById('proposal-content');

      async function renderProposal() {
        if (!container) {
          return;
        }

        container.innerHTML = '<p class="proposal-loading">Loading proposal...</p>';

        try {
          const [markedModule, response] = await Promise.all([
            import('https://cdn.jsdelivr.net/npm/marked@13.0.2/+esm'),
            fetch('./docs/next-edit-suggestions-proposal.md', { cache: 'no-store' }),
          ]);

          if (!response.ok) {
            throw new Error(`Failed to fetch proposal markdown: ${response.status} ${response.statusText}`);
          }

          const markdown = await response.text();
          const { marked } = markedModule;

          marked.use({ mangle: false, headerIds: false });

          const html = marked.parse(markdown);
          container.innerHTML = html;

          for (const anchor of container.querySelectorAll('a[href]')) {
            anchor.setAttribute('target', '_blank');
            anchor.setAttribute('rel', 'noreferrer noopener');
          }
        } catch (error) {
          container.innerHTML =
            '<p class="proposal-error">Something went wrong while loading the proposal. Please refresh the page.</p>';
          console.error('Failed to render proposal markdown', error);
        }
      }

      renderProposal();
    </script>
  </body>
</html>
